<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9ff" />
  <title>Ganti Kata Sandi — Arus Cloud</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    [hidden]{display:none !important}
    body{min-height:100dvh;background:#f7f9ff}
    .recover-layout{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
    .recover-card{width:min(440px,100%);border:1px solid #e2e7f5;border-radius:25px;background:#fff;box-shadow:0 15px 48px #293a7219;padding:clamp(24px,6vw,40px)}
    .recover-card h1{font-size:clamp(27px,6vw,34px);line-height:1.2;margin:16px 0 12px;color:#172246}
    .recover-card label{display:flex;flex-direction:column;gap:7px;margin:16px 0;color:#424c69;font-weight:700;font-size:13px}
    .recover-card input{border:1px solid #dde3f0;border-radius:13px;padding:13px 14px;width:100%;background:#fff;color:#172246;font:inherit}
    .recover-card input:focus{outline:2px solid #736cf1;outline-offset:1px}
    .recover-card button{width:100%;margin-top:12px;white-space:normal}
    .recover-help{font-size:13px;line-height:1.6;color:#6f7b94}
    .recover-notice{font-size:13px;line-height:1.6;padding:12px 14px;border-radius:12px;background:#eff2ff;color:#293f89;margin-top:18px;overflow-wrap:anywhere}
    .recover-notice.error{background:#fff0f2;color:#a52745}
    .recover-status{font-size:13px;color:#67738d;margin:15px 0}
    .recover-link{display:block;text-align:center;color:#565fe2;margin-top:18px;font-size:13px;font-weight:700;text-decoration:none}
    .recover-brand{font-weight:900;font-size:25px;letter-spacing:-1px;color:#232d72}
    .recover-brand span{color:#6266f0}

    .recover-card .pw-field{margin:16px 0}
    .recover-card .pw-field>label{margin:0 0 7px}
    .recover-card .password-box>input{padding-right:58px}
    .recover-card .password-toggle{width:40px;height:40px;margin-top:0;padding:0;border:0;background:transparent;color:#5b6686}
  </style>
</head>
<body>
  <main class="recover-layout">
    <section class="recover-card" aria-labelledby="recoverTitle">
      <div class="recover-brand">↗ arus<span>.</span> cloud</div>
      <h1 id="recoverTitle">Buat kata sandi baru.</h1>
      <p class="recover-help">Setelah kata sandi diperbarui, kamu akan diminta masuk lagi dengan kata sandi baru.</p>
      <div id="loadingMessage" class="recover-status" role="status">Memeriksa tautan pemulihan…</div>
      <div id="accountInfo" class="recover-notice" hidden></div>
      <form id="resetForm" hidden>
        <div class="pw-field">
        <label for="newPassword">Kata sandi baru</label>
        <div class="password-box">
          <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Minimal 8 karakter" />
          <button type="button" class="password-toggle" data-toggle-password="newPassword" aria-controls="newPassword" aria-label="Tampilkan kata sandi" aria-pressed="false" title="Tampilkan kata sandi"><svg class="pw-eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.7A11 11 0 0 1 12 5.6c6.4 0 10 6.4 10 6.4a14 14 0 0 1-3.4 4.3"/><path d="M6.2 6.9A14.2 14.2 0 0 0 2 12s3.6 6.4 10 6.4c1.8 0 3.4-.5 4.8-1.2"/><path d="M10 10a3 3 0 0 0 4 4"/></svg></button>
        </div>
      </div>
        <div class="pw-field">
        <label for="confirmPassword">Konfirmasi kata sandi baru</label>
        <div class="password-box">
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Ulangi kata sandi baru" />
          <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-controls="confirmPassword" aria-label="Tampilkan kata sandi" aria-pressed="false" title="Tampilkan kata sandi"><svg class="pw-eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.7A11 11 0 0 1 12 5.6c6.4 0 10 6.4 10 6.4a14 14 0 0 1-3.4 4.3"/><path d="M6.2 6.9A14.2 14.2 0 0 0 2 12s3.6 6.4 10 6.4c1.8 0 3.4-.5 4.8-1.2"/><path d="M10 10a3 3 0 0 0 4 4"/></svg></button>
        </div>
      </div>
        <button class="btn primary full" id="saveBtn" type="submit">Simpan kata sandi baru</button>
      </form>
      <div id="resultMessage" role="status" aria-live="polite" class="recover-notice" hidden></div>
      <a class="recover-link" href="./">Kembali ke halaman login</a>
    </section>
  </main>
  <script src="./config.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const $ = id => document.getElementById(id);
    const config = window.ARUS_CLOUD_CONFIG || {};
    const form = $('resetForm');
    document.querySelectorAll('[data-toggle-password]').forEach(button=>{
      button.addEventListener('click',()=>{
        const input=$(button.dataset.togglePassword);
        if(!input)return;
        const visible=input.type==='password';
        input.type=visible?'text':'password';
        const action=visible?'Sembunyikan kata sandi':'Tampilkan kata sandi';
        button.setAttribute('aria-pressed',String(visible));
        button.setAttribute('aria-label',action);
        button.title=action;
        input.focus({preventScroll:true});
      });
    });
    const result = $('resultMessage');
    const loading = $('loadingMessage');
    let client;
    let finished = false;
    function notice(text, bad=false){
      result.textContent=text;
      result.classList.toggle('error',bad);
      result.hidden=false;
    }
    const params = new URLSearchParams(location.search);
    const fragment = new URLSearchParams(location.hash.slice(1));
    const linkError = params.get('error_description') || fragment.get('error_description') ||
      params.get('error') || fragment.get('error');
    async function begin(){
      if(linkError){loading.hidden=true;notice('Tautan pemulihan tidak berlaku atau kedaluwarsa. Minta tautan baru dari halaman login.',true);return;}
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(config.SUPABASE_URL||'') ||
         !/^(sb_publishable_|eyJ)/.test(config.SUPABASE_PUBLISHABLE_KEY||'')){
        loading.hidden=true;notice('Konfigurasi Supabase Arus Cloud tidak ditemukan. Hubungi admin.',true);return;
      }
      client=createClient(config.SUPABASE_URL.replace(/\/$/,''),config.SUPABASE_PUBLISHABLE_KEY,{
        auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
      });
      // Supabase dapat membuat sesi sementara dari tautan pemulihan.
      // Jangan navigasi ke dashboard; selalu tampilkan formulir pada halaman khusus ini.
      const {data:{session},error}=await client.auth.getSession();
      if(error||!session){loading.hidden=true;notice('Sesi pemulihan tidak ditemukan. Buka tautan dari email terbaru atau minta reset ulang.',true);return;}
      const {data:{user},error:userError}=await client.auth.getUser();
      if(userError||!user){loading.hidden=true;notice('Sesi pemulihan tidak valid. Minta tautan reset baru.',true);return;}
      loading.hidden=true;
      $('accountInfo').textContent='Akun: '+(user.email||'Pengguna Arus Cloud');
      $('accountInfo').hidden=false;
      form.hidden=false;
      $('newPassword').focus();
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      if(finished||!client)return;
      const password=$('newPassword').value;
      const confirmation=$('confirmPassword').value;
      if(password.length<8){notice('Gunakan minimal 8 karakter.',true);return;}
      if(password!==confirmation){notice('Konfirmasi kata sandi tidak sama.',true);return;}
      const btn=$('saveBtn');btn.disabled=true;btn.textContent='Menyimpan…';result.hidden=true;
      try{
        const {data:{session},error:sessionError}=await client.auth.getSession();
        if(sessionError||!session)throw new Error('Sesi pemulihan sudah tidak berlaku. Minta tautan baru.');
        const {error}=await client.auth.updateUser({password});
        if(error)throw error;
        finished=true;
        form.hidden=true;
        $('accountInfo').hidden=true;
        try{await client.auth.signOut();}catch(error){console.error('Logout setelah reset:',error);}
        history.replaceState(null,'',location.pathname);
        $('recoverTitle').textContent='Kata sandi berhasil diubah!';
        notice('Silakan kembali ke halaman login dan masuk memakai kata sandi baru.');
      }catch(error){notice(error?.message||'Gagal memperbarui kata sandi. Coba lagi.',true);}
      finally{btn.disabled=false;btn.textContent='Simpan kata sandi baru';}
    });
    begin().catch(error=>{loading.hidden=true;console.error(error);notice('Tidak dapat memeriksa tautan. Coba buka ulang dari email.',true);});
  </script>
</body>
</html>
